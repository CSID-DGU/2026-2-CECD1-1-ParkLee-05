spring.application.name=zipsa-lite

# .env (ANTHROPIC_API_KEY, LLM_MODEL, PORT) 가 있으면 읽는다. 없으면 준비된 답변 모드
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# LLM 연동
zipsa.llm.api-key=${ANTHROPIC_API_KEY:}
zipsa.llm.model=${LLM_MODEL:claude-sonnet-5}

# 대화 스트리밍(SSE)이 길어져도 끊기지 않도록
spring.mvc.async.request-timeout=300000

# 응답 JSON 필드 순서를 선언 순서로 (PoC 와 같게. Jackson 3 기본값은 알파벳순)
spring.jackson.mapper.sort-properties-alphabetically=false
