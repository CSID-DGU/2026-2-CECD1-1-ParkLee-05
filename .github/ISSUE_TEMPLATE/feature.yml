name: 기능 개발
description: 새로운 기능 추가 또는 개선 작업
title: "[FEAT] "
labels: ["feat"]
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 기능인지, 왜 필요한지 간단히 적어 주세요.
      placeholder: 예) 사용자가 로봇 상태를 실시간으로 확인할 수 있는 대시보드 페이지
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 세부 작업을 체크박스로 나눠 적어 주세요.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: 파트
      description: 작업 영역을 선택해 주세요. (라벨 backend / frontend 도 함께 붙여 주세요)
      options:
        - be
        - fe
        - be + fe
    validations:
      required: true
  - type: input
    id: wbs
    attributes:
      label: 관련 WBS 번호
      description: Notion WBS의 작업 번호 또는 링크
      placeholder: 예) 3.2 또는 https://www.notion.so/...
    validations:
      required: false
